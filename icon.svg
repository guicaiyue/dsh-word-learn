<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Word Learn">
  <defs>
    <linearGradient id="wl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="wl-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#wl-bg)"/>

  <!-- 单词卡 -->
  <rect x="10" y="17" width="44" height="30" rx="6" fill="url(#wl-card)"/>

  <!-- 首字母 A 的笔画（自绘字形，非字体） -->
  <path d="M17.4 40.5 24 24.2h3.1l6.6 16.3h-3.3l-1.6-4.1h-6.6l-1.6 4.1z"
        fill="#3730a3"/>
  <path d="M22.1 33.8h5l-2.5-6.4z" fill="#eef2ff"/>

  <!-- 音波（发音） -->
  <path d="M37.5 28.2a6 6 0 0 1 0 8.6" fill="none" stroke="#6366f1"
        stroke-width="2.4" stroke-linecap="round"/>
  <path d="M41.6 25.2a10.5 10.5 0 0 1 0 14.6" fill="none" stroke="#a5b4fc"
        stroke-width="2.4" stroke-linecap="round"/>

  <!-- 底部“词频刻度”三点，示意分级 -->
  <circle cx="22" cy="52.5" r="2.2" fill="#ffffff" opacity=".95"/>
  <circle cx="30" cy="52.5" r="2.2" fill="#ffffff" opacity=".62"/>
  <circle cx="38" cy="52.5" r="2.2" fill="#ffffff" opacity=".34"/>
</svg>
