<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>补记循环 · 原型</title>
<style>
  :root{
    --bg:#151517; --layer:#232324; --layer2:#2b2b2d;
    --fg:#f9fafb; --fg2:#cfd3d6; --fg3:#8b9096;
    --line:rgba(255,255,255,.12);
    --accent:#6ea8fe; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:32px 16px;
  }
  .wrap{width:100%;max-width:560px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;color:var(--fg3);font-size:12px}
  .debt{display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--accent)}
  .card{
    background:var(--layer);border:1px solid var(--line);border-radius:16px;
    padding:28px 26px 22px;box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .word{font-size:30px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
  .phon{font-family:var(--mono);color:var(--fg3);font-size:13px;margin-top:4px}
  .sentence{font-size:17px;line-height:1.75;color:var(--fg2);margin:18px 0 6px}
  .sentence .blank{color:var(--accent);font-weight:600;letter-spacing:.04em}
  .q{font-size:13px;color:var(--fg3);margin:16px 0 10px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{
    text-align:left;background:var(--layer2);border:1px solid var(--line);color:var(--fg);
    padding:11px 14px;border-radius:10px;font-size:15px;cursor:pointer;transition:.15s;
    font-family:inherit;
  }
  .opt:hover{border-color:rgba(110,168,254,.5);background:#303033}
  .opt.sel{border-color:var(--accent);background:rgba(110,168,254,.12)}
  .opt.ok{border-color:var(--ok);background:rgba(74,222,128,.12)}
  .opt.bad{border-color:var(--bad);background:rgba(248,113,113,.12)}
  .opt.dim{opacity:.45}
  .ghost{
    background:none;border:1px solid var(--line);color:var(--fg3);border-radius:9px;
    padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .ghost:hover{color:var(--fg2);border-color:rgba(255,255,255,.25)}
  .row{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
  .primary{
    background:var(--accent);color:#0b1220;border:0;border-radius:9px;
    padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .primary:disabled{opacity:.35;cursor:not-allowed}
  .contrast{font-size:17px;line-height:1.7;margin:4px 0 0}
  .contrast b{color:var(--warn)}
  .why{
    margin-top:14px;padding:12px 14px;border-left:2px solid var(--accent);
    background:rgba(110,168,254,.07);border-radius:0 8px 8px 0;
    color:var(--fg2);font-size:14px;
  }
  .map{margin-top:16px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg3)}
  .map b{color:var(--fg2);font-weight:500}
  input[type=text]{
    width:100%;background:var(--layer2);border:1px solid var(--line);border-radius:10px;
    color:var(--fg);padding:12px 14px;font-size:18px;font-family:var(--mono);letter-spacing:.05em;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent)}
  .hint{font-size:12px;color:var(--fg3);margin-top:8px;min-height:18px;font-family:var(--mono)}
  .msg{font-size:13px;margin-top:10px;min-height:20px}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  .shake{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .fade{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .steps{display:flex;gap:4px;margin-top:20px}
  .steps i{height:2px;flex:1;background:var(--line);border-radius:2px}
  .steps i.on{background:var(--accent)}
  .note{margin-top:22px;color:var(--fg3);font-size:12px;line-height:1.7}
  .note code{font-family:var(--mono);color:var(--fg2)}
  .kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span id="stepLabel">assess</span>
    <span class="debt">今日补记 <b id="debtN" style="color:var(--fg2)">0</b>/3
      <span id="dots" style="display:flex;gap:4px;margin-left:6px"></span>
    </span>
  </div>

  <div class="card" id="card"></div>

  <p class="note">
    原型只演示「忘了」分支：R0 猜义项 → R1 反差 → R2 完形 → R3 换句复现。
    真实实现见 <code>design/forgot-repair-loop.md</code>。
  </p>
</div>

<script>
const WORDS = [
  {
    word: 'resolution', phon: '/ˌrezəˈluːʃn/',
    sentence: 'After the third outage this week, she made a ______ to stop deploying on Fridays.',
    options: ['分辨率', '决心；决定', '解决方案', '解析度'], correct: 1,
    why: '技术文本里 resolution 几乎只以「分辨率」出现，这条路径被反复加固了。',
    known: '1 / 4',
    answer: 'resolution',
    recheck: {
      sentence: 'He made a New Year\'s ______ to run every morning.',
      options: ['分辨率', '决心；决定', '解析度', '解决方案'], correct: 1
    }
  },
  {
    word: 'charge', phon: '/tʃɑːdʒ/',
    sentence: 'The battery ______ in about 30 minutes.',
    options: ['收费', '指控', '充电', '负责'], correct: 2,
    why: 'charge 在账单语境里最常出现「收费」，但它的核心隐喻是 load（装载）：装电就是充电。',
    known: '1 / 4',
    answer: 'charge',
    recheck: {
      sentence: 'My phone needs to ______ overnight.',
      options: ['收费', '指控', '充电', '负责'], correct: 2
    }
  },
  {
    word: 'latent', phon: '/ˈleɪtnt/',
    sentence: 'The model learns a ______ representation of the input.',
    options: ['潜空间', '潜在的', '显式的', '潜伏期的'], correct: 1,
    why: '你把 latent 当成了名词短语的一部分。它是形容词「潜在的」，修饰 representation；「潜空间」是 latent space 的整体译法。',
    known: '0 / 3',
    answer: 'latent',
    recheck: {
      sentence: 'There is a ______ demand for cheaper batteries.',
      options: ['潜空间', '潜在的', '显式的', '潜伏期的'], correct: 1
    }
  }
];

const $ = (s) => document.querySelector(s);
const card = $('#card');
let idx = 0, stage = 'assess', chosen = null, hint = 0, cleared = 0;

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }

function renderDots() {
  $('#dots').innerHTML = WORDS.map((_, i) => `<i class="dot ${i < cleared ? 'on' : ''}"></i>`).join('');
  $('#debtN').textContent = cleared;
}

function setStep(t) { $('#stepLabel').textContent = t; }

function render() {
  const w = WORDS[idx];
  if (stage === 'assess') return renderAssess(w);
  if (stage === 'commit') return renderCommit(w);
  if (stage === 'contrast') return renderContrast(w);
  if (stage === 'produce') return renderProduce(w);
  if (stage === 'recheck') return renderRecheck(w);
  if (stage === 'done') return renderDone();
}

function head(w) {
  return `<div class="word">${w.word}</div><div class="phon">${w.phon}</div>`;
}

function renderAssess(w) {
  setStep('assess');
  card.innerHTML = '';
  card.append(el(`
    <div class="fade">
      ${head(w)}
      <div class="q">先想想这个词是什么意思 —— 你上次在这句里见过它：</div>
      <div class="sentence">${w.sentence.replace('______', '<span class="blank">______</span>')}</div>
      <div class="row">
        <button class="ghost" data-a="forgot">忘了</button>
        <button class="ghost" data-a="fuzzy">模糊</button>
        <button class="ghost" data-a="known">记得</button>
      </div>
      <div class="msg" id="m"></div>
    </div>`));
  card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    if (b.dataset.a !== 'forgot') { $('#m').textContent = '原型只演示「忘了」分支。'; $('#m').className = 'msg'; return; }
    stage = 'commit'; render();
  });
}

function renderCommit(w) {
  setStep('R0 · 先别给答案');
  card.innerHTML = '';
  const opts = w.options.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('');
  card.append(el(`
    <div class="fade">
      ${head(w)}
      <div class="sentence">${w.sentence.replace('______', '<span class="blank">______</span>')}</div>
      <div class="q">这句话里，${w.word} 是什么意思？</div>
      <div class="opts">${opts}</div>
      <div class="row"><button class="ghost" id="dunno">完全不记得</button></div>
      <div class="msg" id="m"></div>
      <div class="steps"><i class="on"></i><i></i><i></i><i></i></div>
    </div>`));
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    chosen = Number(b.dataset.i);
    stage = 'contrast'; render();
  });
  card.querySelector('#dunno').onclick = () => { chosen = null; stage = 'contrast'; render(); };
}

function renderContrast(w) {
  setStep('R1 · 反差');
  card.innerHTML = '';
  const right = w.correct;
  const picked = chosen === null ? '（完全不记得）' : w.options[chosen];
  const hit = chosen === right;
  card.append(el(`
    <div class="fade">
      ${head(w)}
      <div class="contrast">
        ${hit
          ? `你选对了 —— <b>「${w.options[right]}」</b>。<br>但先别急着走，把它写出来一次。`
          : `你选的是 <b>${picked}</b>。<br>这句里是 <b>「${w.options[right]}」</b>。`}
      </div>
      <div class="why">${w.why}</div>
      <div class="map">
        <span>义项地图</span>
        <span><b>${w.known}</b> 个义项你认识</span>
        <span>这句用的是第 <b>${right + 1}</b> 个</span>
      </div>
      <div class="row"><button class="primary" id="next">继续 · 把它写出来</button></div>
      <div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div>
    </div>`));
  card.querySelector('#next').onclick = () => { hint = 0; stage = 'produce'; render(); };
}

function renderProduce(w) {
  setStep('R2 · 产出');
  card.innerHTML = '';
  const blanked = w.sentence.replace(w.answer, '______');
  card.append(el(`
    <div class="fade">
      <div class="sentence">${blanked.replace('______', '<span class="blank">______</span>')}</div>
      <input type="text" id="ans" placeholder="把单词拼出来" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <div class="hint" id="hint"></div>
      <div class="row">
        <button class="ghost" id="tip">提示</button>
        <button class="primary" id="ok">提交</button>
      </div>
      <div class="msg" id="m"></div>
      <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    </div>`));
  const input = card.querySelector('#ans');
  const msg = card.querySelector('#m');
  const hintEl = card.querySelector('#hint');
  input.focus();
  const tips = [
    `首字母：${w.answer[0]}`,
    `音标：${w.phon}`,
    `逐字母：${w.answer.split('').map((c, i) => i < 2 ? c : '_').join(' ')}`
  ];
  card.querySelector('#tip').onclick = () => {
    if (hint < tips.length) { hintEl.textContent = tips[hint++]; }
    else hintEl.textContent = `答案：${w.answer}（抄写一遍）`;
  };
  function submit() {
    const v = input.value.trim().toLowerCase();
    if (!v) return;
    if (v === w.answer) {
      msg.className = 'msg ok'; msg.textContent = '✓ 对。';
      input.disabled = true;
      setTimeout(() => { stage = 'recheck'; render(); }, 550);
    } else {
      msg.className = 'msg bad'; msg.textContent = '再试一次 —— 注意词尾。';
      input.classList.add('shake');
      setTimeout(() => input.classList.remove('shake'), 320);
    }
  }
  card.querySelector('#ok').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

function renderRecheck(w) {
  setStep('R3 · 2 张卡之后，换一句');
  card.innerHTML = '';
  const r = w.recheck;
  const opts = r.options.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('');
  card.append(el(`
    <div class="fade">
      <div class="q" style="margin-top:0">换一个新句子 —— 不是背，是认出来：</div>
      <div class="sentence">${r.sentence.replace('______', '<span class="blank">______</span>')}</div>
      <div class="q">这句里的 ${w.word} 是哪个意思？</div>
      <div class="opts">${opts}</div>
      <div class="msg" id="m"></div>
      <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    </div>`));
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i);
    if (i === r.correct) {
      b.classList.add('ok');
      card.querySelectorAll('.opt').forEach(x => x.disabled = true);
      cleared++; renderDots();
      setTimeout(() => { idx++; if (idx >= WORDS.length) { stage = 'done'; render(); } else { stage = 'assess'; render(); } }, 700);
    } else {
      b.classList.add('bad');
      card.querySelector('#m').className = 'msg bad';
      card.querySelector('#m').textContent = '不对。回到那句原话再想一次。';
      setTimeout(() => { stage = 'contrast'; render(); }, 900);
    }
  });
}

function renderDone() {
  setStep('done');
  card.innerHTML = '';
  card.append(el(`
    <div class="fade" style="text-align:center;padding:18px 0">
      <div style="font-size:34px;margin-bottom:8px">✓</div>
      <div style="font-size:18px;font-weight:600">今日补记已清债</div>
      <div style="color:var(--fg3);font-size:13px;margin-top:8px">
        3 个词，每个都经过了：猜 → 被打脸 → 拼出来 → 换句认回来。
      </div>
      <div class="row" style="justify-content:center">
        <button class="ghost" id="again">再走一遍</button>
      </div>
      <div class="note" style="text-align:left;margin-top:26px">
        真实流程还会继续：会话末再复现一次（R4），次日做「同义 / 不同义」判别（R5），
        3 天后用这个词说一件你工作里的事（R6）。FSRS 的评级只记「第一次无提示提取」，
        补记的成功不写回排期 —— 免得骗过调度器。
      </div>
    </div>`));
  card.querySelector('#again').onclick = () => { idx = 0; cleared = 0; stage = 'assess'; renderDots(); render(); };
}

renderDots();
render();
</script>
</body>
</html>
